apply plugin: 'com.android.application'
android {
    namespace "imgui.il2cpp.tool"
    compileSdkVersion 30
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "3.2"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    ndkVersion "30.0.16248370"
    buildTypes {
        release {
            minifyEnabled true
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        debug {
            minifyEnabled false
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }

    }
    packagingOptions {
        exclude  '**/libdobby.so'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'
}

task checkIfAdbIsConnected {
    doLast {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine android.adbExecutable, "devices"
            standardOutput stdout
        }

        if (stdout.toString().find("device\n") == null) {
            throw new GradleException("No devices connected through adb")
        }
    }
}

def getPackageName() {
    def packageNameFile = new File(layout.projectDirectory.dir("../../package_name.txt").asFile.getAbsolutePath())
    if (!packageNameFile.exists()) throw new GradleException("package_name.txt not found\nCreate one with the content of your target\napk package name and place it beside build.py")
    def packageNameList = packageNameFile.readLines()
    if (packageNameList.empty) throw new GradleException("package_name.txt is empty")

    def package_name = packageNameList[0]
    return package_name
}

def getPackagePath(String packageName) {
    def output = new ByteArrayOutputStream()
    exec {
        commandLine android.adbExecutable, "shell", "pm", "path", "${packageName}"
        standardOutput output
        ignoreExitValue true
    }
    def pathParts = output.toString().trim().split(":")
    if (pathParts.length != 2) throw new GradleException("Unable to retrieve package path : ${packageName}")
    def apkPath = pathParts[1]

    def package_path = apkPath.split("/")[0..-2].join("/") + "/"
    return package_path
}

def getPackageLibPath(String packagePath) {
    def output = new ByteArrayOutputStream()
    def command = [android.adbExecutable, "shell", "ls", "${packagePath}/lib"]
    def result = exec {
        commandLine command
        standardOutput output
        ignoreExitValue true
    }
    if (result.exitValue != 0) throw new GradleException("Failed to get package lib path\ncommand : ${command.join(" ")}\nFailed with exit code : ${result.exitValue}")

    def package_lib_path = "${packagePath}lib/${output}".toString()
    return package_lib_path
}

task copyApk {
    if (project.hasProperty("release")) {
        dependsOn("assembleRelease")
    } else {
        dependsOn("assembleDebug")
    }
    doLast {
        def flavor = project.hasProperty("release") ? "release" : "debug"
        if (flavor == "release") {
            println("Copying release apk")
        } else {
            println("Copying debug apk")
        }
        def buildDir = fileTree(layout.buildDirectory.get())
        def apks = buildDir.matching {
            include "**/$flavor/*.apk"
        }
        if (apks.empty) {
            throw new GradleException("No apk found")
        }

        apks = apks.sort { it.lastModified() }.reverse()

        def src = apks[0]
        def dst = project.file("../../")
        println("Copying \n${src}\nto\n${dst}")
        copy {
            from src
            into dst
            rename { "menu_${flavor}.apk" }

        }
    }
}

def stopProcess(String packageName) {
    def result = exec {
        commandLine android.adbExecutable, "shell", "am", "force-stop", "${packageName}"
        ignoreExitValue true
    }
    if (result.exitValue != 0) throw new GradleException("Failed to stop process : ${packageName}")
}

def startProcess(String packageName) {
    def result = exec {
        commandLine android.adbExecutable, "shell", "monkey", "-p", "${packageName}", "-c", "android.intent.category.LAUNCHER", "1"
        ignoreExitValue true
    }
    if (result.exitValue != 0) throw new GradleException("Failed to start process : ${packageName}")
}

task sendToPhone {
    dependsOn(checkIfAdbIsConnected)
    doLast {
        def packageName = getPackageName()
        def packagePath = getPackagePath(packageName)
        def packageLibPath = getPackageLibPath(packagePath)

        def flavor = project.hasProperty("release") ? "release" : "debug"
        def libName = "libTool.so"
        def libPath = new File("${layout.buildDirectory.dir("intermediates/stripped_native_libs/$flavor/out/lib").get().asFile.absolutePath}")
        if (!libPath.exists()) throw new GradleException("lib files not found")
        def libFiles = fileTree(libPath).matching {
            include "**/${libName}"
        }
        libFiles = libFiles.sort { it.lastModified() }.reverse()
        def libFile = libFiles[0]
        println("Pushing ${libName} to /sdcard")
        def result = exec {
            commandLine android.adbExecutable, "push", "${libFile.absolutePath}", "/sdcard"
            ignoreExitValue true
        }
        if (result.exitValue != 0) {
            println("Failed to push ${libFile.absolutePath} to /data/local/tmp")
        }
        result = exec {
            commandLine android.adbExecutable, "shell", "su", "-c", "mv /sdcard/${libName} ${packageLibPath}"
            ignoreExitValue true
        }
        if (result.exitValue != 0) {
            println("Failed to move ${libName} to ${packageLibPath}")
        }
        println("Moved ${libName} to ${packageLibPath}")
    }
}

task sendToPhoneAndRestart {
    dependsOn(sendToPhone)
    doLast {
        stopProcess(getPackageName())
        startProcess(getPackageName())
    }
}

// Assemble a flashable Zygisk/KernelSU module zip:
//   zygisk/arm64-v8a.so, zygisk/armeabi-v7a.so  (renamed libTool.so)
//   webroot/  (KernelSU WebUI)
//   module.prop, service.sh, post-fs-data.sh
def nativeLibDir(String flavor) {
    def candidates = [
            layout.buildDirectory.dir("intermediates/stripped_native_libs/${flavor}/strip${flavor.capitalize()}DebugSymbols/out/lib").get().asFile,
            layout.buildDirectory.dir("intermediates/stripped_native_libs/${flavor}/out/lib").get().asFile,
            layout.buildDirectory.dir("intermediates/cmake/${flavor}/obj").get().asFile,
    ]
    return candidates.find { it.exists() }
}

task assembleZygiskModule {
    group = "build"
    description = "Pack libTool.so (both ABIs) + WebUI into a flashable Zygisk zip"
    doLast {
        def flavor = project.hasProperty("release") ? "release" : "debug"
        def libRoot = nativeLibDir(flavor)
        if (libRoot == null || !libRoot.exists()) {
            throw new GradleException("Native libs not found for flavor ${flavor}. Run assembleDebug/assembleRelease first.")
        }
        def staging = layout.buildDirectory.dir("zygisk-module").get().asFile
        delete staging
        staging.mkdirs()

        copy {
            from rootProject.file("zygisk-module")
            into staging
            exclude "zygisk"
        }

        def webuiDist = rootProject.file("webui/dist")
        def webrootSrc = rootProject.file("zygisk-module/webroot")
        if (webuiDist.exists()) {
            copy {
                from webuiDist
                into new File(staging, "webroot")
            }
        } else if (webrootSrc.exists()) {
            copy {
                from webrootSrc
                into new File(staging, "webroot")
            }
        }

        def zygiskDir = new File(staging, "zygisk")
        zygiskDir.mkdirs()
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            def so = new File(libRoot, "${abi}/libTool.so")
            if (!so.exists()) {
                // cmake obj layout: abi/libTool.so
                so = fileTree(libRoot).matching { include "**/${abi}/**/libTool.so" }.files.find { true }
            }
            if (so == null || !so.exists()) {
                logger.warn("Missing libTool.so for ${abi} — zip will omit that ABI")
                return
            }
            ant.copy(file: so, tofile: new File(zygiskDir, "${abi}.so"))
        }
        if (fileTree(zygiskDir).files.isEmpty()) {
            throw new GradleException("No libTool.so copied into zygisk/")
        }

        def outDir = rootProject.file("out/${flavor}")
        outDir.mkdirs()
        def zipFile = new File(outDir, "il2cpp-tool-zygisk-${flavor}.zip")
        if (zipFile.exists()) zipFile.delete()
        ant.zip(destfile: zipFile) {
            fileset(dir: staging)
        }
        println("Zygisk module zip: ${zipFile.absolutePath}")
    }
}

tasks.configureEach { task ->
    if (task.name == "assembleDebug" || task.name == "assembleRelease") {
        def flavor = task.name.substring(8).toLowerCase()

        def libName = "libTool.so"
        def libPath = new File("${layout.buildDirectory.dir("intermediates/stripped_native_libs/$flavor/out/lib").get().asFile.absolutePath}")
        def dst = project.file("../out/${flavor}")

        task.doLast {
            copy {
                from libPath
                into dst
            }

            def releaseDexPath = new File("${layout.buildDirectory.dir("intermediates/dex/release/minifyReleaseWithR8").get().asFile.absolutePath}")
            if (flavor == "release") {
                copy {
                    from releaseDexPath
                    into dst
                }
            }
        }

        task.finalizedBy("assembleZygiskModule")

        if (project.hasProperty("send") || project.hasProperty("s")) {
            task.finalizedBy(sendToPhone)
        } else if(project.hasProperty("sendAndRestart") || project.hasProperty("snr")) {
            task.finalizedBy(sendToPhoneAndRestart)
        }
    }
}

// 生成 overlay_dex.h：把 classes.dex 转成 C 字节数组嵌入 native so，
// 运行时用 InMemoryDexClassLoader 加载，无需文件系统权限。
task generateDexHeader {
    doLast {
        // 优先选项目代码 dex（mergeProjectDexDebug），不选外部依赖 dex（mergeExtDexDebug）
        def projectDexDir = file("$buildDir/intermediates/dex/debug/mergeProjectDexDebug")
        def dexFile = null
        if (projectDexDir.exists()) {
            def candidates = fileTree(dir: projectDexDir, include: "**/classes*.dex").files.sort { -it.lastModified() }
            dexFile = candidates.find { it.exists() }
        }
        if (dexFile == null) {
            def allDex = fileTree(dir: "$buildDir/intermediates/dex", include: "**/classes*.dex").files
            dexFile = allDex.find { it.exists() && !it.path.contains("mergeExtDex") }
        }
        def outputFile = file("src/main/jni/overlay_dex.h")
        if (dexFile) {
            def bytes = dexFile.bytes
            def sb = new StringBuilder()
            sb.append("#pragma once\n// Auto-generated from classes.dex - DO NOT EDIT\n#include <cstddef>\n")
            sb.append("static const unsigned char overlay_dex[] = {\n")
            for (int i = 0; i < bytes.length; i++) {
                if (i % 16 == 0) sb.append("    ")
                sb.append(String.format("0x%02X", bytes[i] & 0xFF))
                if (i < bytes.length - 1) sb.append(",")
                if (i % 16 == 15) sb.append("\n")
            }
            sb.append("\n};\n")
            sb.append("static const unsigned int overlay_dex_len = ${bytes.length};\n")
            outputFile.text = sb.toString()
            println "Generated overlay_dex.h from ${dexFile.name} (${bytes.length} bytes)"
        } else {
            outputFile.text = "#pragma once\n// placeholder - regenerated after dex build\n#include <cstddef>\nstatic const unsigned char overlay_dex[] = {0};\nstatic const unsigned int overlay_dex_len = 1;\n"
            println "No dex found yet, using placeholder overlay_dex.h"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith("externalNativeBuild")) {
        task.dependsOn generateDexHeader
    }
    // generateDexHeader 必须在 dex 生成之后执行，否则读到旧 dex
    if (task.name == "generateDexHeader") {
        task.dependsOn "mergeProjectDexDebug"
    }
}
