<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IL2CPP Tool · 目标包</title>
</head>
<body>
  <h1>IL2CPP Tool 目标包</h1>
  <div class="sub" id="path">/data/adb/il2cpp_tool/targets.txt</div>

  <div class="card">
    <div class="row">
      <h2>已启用目标</h2>
      <button id="btnRefresh">刷新</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty">暂无目标包</div>
  </div>

  <div class="card">
    <h2>添加目标包</h2>
    <div class="addrow">
      <input id="pkgInput" placeholder="com.example.game" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="primary" id="btnAdd">添加</button>
    </div>
    <div class="hint">填写完整包名，添加或删除后立即写入配置文件。</div>
  </div>

  <div id="toast"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
