<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IL2CPP Tool · 目标包</title>
<style>
  :root {
    --bg: #101215;
    --card: #1a1d21;
    --line: #2a2f35;
    --text: #e8eaed;
    --muted: #8b939c;
    --accent: #3b82f6;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; word-break: break-all; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  button {
    font: inherit;
    color: var(--text);
    background: #262b31;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:active { background: #31373e; }
  button:disabled { opacity: .5; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger {
    background: transparent;
    border-color: transparent;
    color: var(--danger);
    padding: 4px 10px;
    font-size: 20px;
    line-height: 1;
  }
  input {
    font: inherit;
    width: 100%;
    color: var(--text);
    background: #14171a;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; min-width: 0; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: none; }
  li .pkg { word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: #2a2f35;
    color: #fff;
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    max-width: 80%;
    text-align: center;
    z-index: 9;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <h1>IL2CPP Tool 目标包</h1>
  <div class="sub" id="path">/data/adb/il2cpp_tool/targets.txt</div>

  <div class="card">
    <div class="row">
      <h2>已启用目标</h2>
      <button id="btnRefresh">刷新</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty">暂无目标包</div>
  </div>

  <div class="card">
    <h2>添加目标包</h2>
    <div class="addrow">
      <input id="pkgInput" placeholder="com.example.game" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="primary" id="btnAdd">添加</button>
    </div>
    <div class="hint">填写完整包名，添加或删除后立即写入配置文件。</div>
  </div>

  <div id="toast"></div>

<script>
(function () {
  'use strict';

  // 目标包配置文件（与 Tool/Targets.h 的 kConfigPath 保持一致）
  var FILE = '/data/adb/il2cpp_tool/targets.txt';
  var DIR = '/data/adb/il2cpp_tool';
  var DEFAULT_COMMENT = '# One package name per line. Edited by the KernelSU WebUI.';

  var comments = [];   // 保留的注释行（# 开头）
  var targets = [];    // 目标包名，保持文件顺序并去重
  var cbSeq = 0;       // 异步回调函数名序号
  var busy = false;    // 写操作进行中，避免重复提交

  var elList = document.getElementById('list');
  var elEmpty = document.getElementById('empty');
  var elInput = document.getElementById('pkgInput');
  var elAdd = document.getElementById('btnAdd');
  var elRefresh = document.getElementById('btnRefresh');

  /* ---------- 基础工具 ---------- */

  // 页内提示条
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  // UTF-8 字符串转 base64，避免写文件时的 shell 转义问题
  function toBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  // 调用 KernelSU 的 ksu.exec(cmd, callback)，包装为 Promise
  // 回调通过 WebView 的 javascript: URL 触发，因此必须是全局函数名
  function ksuExec(cmd) {
    return new Promise(function (resolve) {
      var name = 'ksuCb' + (++cbSeq);
      var done = false;
      function finish(code, out, err) {
        if (done) return;
        done = true;
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        resolve({ code: code, out: out || '', err: err || '' });
      }
      window[name] = function (code, out, err) { finish(code, out, err); };
      try {
        ksu.exec(cmd, name);
      } catch (e) {
        finish(-1, '', String(e));
        return;
      }
      // 部分管理器的回调可能不返回，超时兜底避免界面卡死
      setTimeout(function () { finish(-1, '', '执行超时'); }, 8000);
    });
  }

  // 解析文件内容：# 开头为注释，其余为包名；空行忽略，重复包名去重
  function parse(text) {
    var result = { comments: [], targets: [] };
    text.split('\n').forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      if (line.charAt(0) === '#') {
        result.comments.push(line);
        return;
      }
      if (result.targets.indexOf(line) === -1) result.targets.push(line);
    });
    return result;
  }

  // 生成文件内容：先写注释，再写包名
  function serialize() {
    var lines = comments.length ? comments.slice() : [DEFAULT_COMMENT];
    return lines.concat(targets).join('\n') + '\n';
  }

  // 包名校验：至少包含一个点，仅允许字母/数字/下划线/点
  function isPackageName(name) {
    return /^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+$/.test(name);
  }

  /* ---------- 渲染 ---------- */

  function render() {
    elList.innerHTML = '';
    targets.forEach(function (pkg) {
      var li = document.createElement('li');

      var span = document.createElement('span');
      span.className = 'pkg';
      span.textContent = pkg;

      var btn = document.createElement('button');
      btn.className = 'danger';
      btn.textContent = '\u00d7';
      btn.title = '删除';
      btn.addEventListener('click', function () {
        if (busy) return;
        targets = targets.filter(function (p) { return p !== pkg; });
        render();
        save();
      });

      li.appendChild(span);
      li.appendChild(btn);
      elList.appendChild(li);
    });
    elEmpty.style.display = targets.length ? 'none' : 'block';
  }

  /* ---------- 读写 ---------- */

  function load() {
    return ksuExec('cat ' + FILE + ' 2>/dev/null').then(function (r) {
      if (r.code !== 0) {
        // 文件不存在：视为空列表，首次写入时自动创建
        comments = [];
        targets = [];
      } else {
        var parsed = parse(r.out);
        comments = parsed.comments;
        targets = parsed.targets;
      }
      render();
    });
  }

  function save() {
    busy = true;
    elAdd.disabled = true;
    var b64 = toBase64(serialize());
    // 用 base64 传输内容，规避包名/注释中的特殊字符被 shell 解析
    var cmd = 'mkdir -p ' + DIR + " && printf %s '" + b64 + "' | base64 -d > " + FILE +
      ' && chmod 644 ' + FILE;
    return ksuExec(cmd).then(function (r) {
      busy = false;
      elAdd.disabled = false;
      if (r.code === 0) {
        toast('已保存');
      } else {
        toast('保存失败：' + (r.err || ('code ' + r.code)));
      }
    });
  }

  /* ---------- 事件 ---------- */

  function add() {
    if (busy) return;
    var name = (elInput.value || '').trim();
    if (!isPackageName(name)) {
      toast('包名格式不正确');
      return;
    }
    if (targets.indexOf(name) !== -1) {
      toast('该包名已存在');
      elInput.value = '';
      return;
    }
    targets.push(name);
    elInput.value = '';
    render();
    save();
  }

  elAdd.addEventListener('click', add);
  elInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') add();
  });
  elRefresh.addEventListener('click', function () {
    load().then(function () { toast('已刷新'); });
  });

  /* ---------- 启动 ---------- */

  if (typeof ksu === 'undefined' || !ksu || typeof ksu.exec !== 'function') {
    // 在普通浏览器中打开时给出提示，便于调试页面本身
    toast('请在 KernelSU 管理器内打开本页面');
    render();
    return;
  }
  load();
})();
</script>
</body>
</html>
